[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tunedrop"
version = "0.1.0"
description = "Archive music metadata links from the command line"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Avi Chadda" }]
dependencies = [
    "mutagen>=1.47,<2",
    "platformdirs>=4.3,<5",
    "requests>=2.32,<3",
    "typer>=0.12,<1",
    "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[project.scripts]
tunedrop = "tunedrop.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tunedrop"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]