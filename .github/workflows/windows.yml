name: Windows

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  executable:
    name: Windows x64 executable
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install TuneDrop and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name tunedrop `
            --collect-all yt_dlp `
            --collect-all mutagen `
            src\tunedrop\__main__.py

      - name: Test executable
        run: .\dist\tunedrop.exe --version

      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path dist\tunedrop.exe -DestinationPath dist\TuneDrop-Windows-x64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: TuneDrop-Windows-x64
          path: dist/TuneDrop-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach Windows build to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: executable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TuneDrop-Windows-x64
          path: dist

      - name: Upload tagged build to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          for _ in $(seq 1 60); do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" dist/TuneDrop-Windows-x64.zip --clobber
              exit 0
            fi
            sleep 10
          done
          echo "Release $tag was not created within 10 minutes." >&2
          exit 1
