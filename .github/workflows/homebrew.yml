name: Homebrew

on:
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - "install.sh"
      - "pyproject.toml"
      - ".github/workflows/homebrew.yml"
  pull_request:
    paths:
      - "Formula/**"
      - "install.sh"
      - "pyproject.toml"
      - ".github/workflows/homebrew.yml"
  workflow_dispatch:

jobs:
  formula:
    name: Audit & install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check installer syntax
        run: sh -n install.sh

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # v2026.10.19.1

      - name: Tap this repository
        run: brew tap avichadda/tunedrop "${{ github.workspace }}"

      - name: Check formula style (brew style)
        run: brew style avichadda/tunedrop/tunedrop

      - name: Audit formula (brew audit --strict)
        run: brew audit --strict avichadda/tunedrop/tunedrop

      - name: Install from HEAD (brew install --HEAD --build-from-source)
        run: brew install --HEAD --verbose --build-from-source avichadda/tunedrop/tunedrop

      - name: Run formula test block (brew test)
        run: brew test avichadda/tunedrop/tunedrop

      - name: Verify the installed binary runs
        run: brew --prefix tunedrop && "$(brew --prefix tunedrop)/bin/tunedrop" --help
