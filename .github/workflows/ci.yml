name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint Python
        run: python -m ruff check src tests

      - name: Run Python tests
        run: python -m pytest

  macos:
    name: macOS app
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.2

      - name: Check scripts and appcast
        run: |
          sh -n install.sh scripts/*.sh
          xmllint --noout appcast.xml

      - name: Build macOS app
        run: ./scripts/build-macos-app.sh

      - name: Verify app bundle
        run: |
          plutil -lint dist/TuneDrop.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/TuneDrop.app
          test -x dist/TuneDrop.app/Contents/MacOS/TuneDrop
          test -x dist/TuneDrop.app/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle
